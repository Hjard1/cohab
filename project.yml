name: Cohab
options:
  bundleIdPrefix: com.hjard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Cohab:
    type: application
    platform: iOS
    sources:
      - Cohab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hjard.cohab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Cohab/Cohab.entitlements
        DEVELOPMENT_TEAM: V83XPV3UQD
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.202318303891-bk19jn92jfdg01t6r3p7v6nqp53gk9ai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: GoogleSignIn
      - package: Supabase
    info:
      path: Cohab/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLSchemes:
              - cohab
        LSApplicationQueriesSchemes:
          - googlegmail
          - googlegmail-hd
        ITSAppUsesNonExemptEncryption: false

  CohabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CohabUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hjard.cohab.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Cohab
    dependencies:
      - target: Cohab

schemes:
  Cohab:
    build:
      targets:
        Cohab: all
    run:
      config: Debug
      storeKitConfiguration: Cohab/Cohab.storekit
    test:
      config: Debug
      targets:
        - CohabUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
